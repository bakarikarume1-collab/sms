{% extends "base.html" %}

{% block title %}Reset Password | KarumeStore{% endblock %}

{% block content %}

<main class="auth-page">

    <div class="auth-card">

        <span class="eyebrow">SECURE YOUR ACCOUNT</span>

        <h1>Reset Password</h1>

        <p>
            Create a new password for your KarumeStore account.
        </p>


        <form id="reset-password-form" novalidate>

            <label>
                New Password

                <input
                    id="new-password"
                    type="password"
                    placeholder="Enter new password"
                >
            </label>


            <label>
                Confirm Password

                <input
                    id="confirm-password"
                    type="password"
                    placeholder="Confirm new password"
                >
            </label>


            <button
                class="primary-btn"
                type="submit"
            >
                Reset Password
            </button>


            <p
                id="reset-message"
                class="form-message"
            ></p>

        </form>

    </div>

</main>

{% endblock %}
