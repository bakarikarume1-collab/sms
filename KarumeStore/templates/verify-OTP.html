{% extends "base.html" %}

{% block title %}Verify OTP | KarumeStore{% endblock %}

{% block content %}

<main class="auth-page">

    <div class="auth-card">

        <span class="eyebrow">SECURITY VERIFICATION</span>

        <h1>Verify OTP</h1>

        <p>
            Enter the 6-digit verification code sent to your email.
        </p>

        <form id="verify-otp-form" novalidate>

            <label>
                Email

                <input
                    id="verify-email"
                    type="email"
                    placeholder="Enter your email"
                >
            </label>

            <label>
                OTP

                <input
                    id="otp"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                >
            </label>

            <button
                class="primary-btn"
                type="submit"
            >
                Verify OTP
            </button>

            <p
                id="verify-message"
                class="form-message"
            ></p>

        </form>

        <p>
            <a href="/forgot-password">
                Request a new OTP
            </a>
        </p>

    </div>

</main>

{% endblock %}
