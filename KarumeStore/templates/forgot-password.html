{% extends "base.html" %}

{% block title %}Forgot Password | KarumeStore{% endblock %}

{% block content %}

<main class="auth-page">

    <div class="auth-card">

        <span class="eyebrow">ACCOUNT RECOVERY</span>

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address and we'll send you
            a verification code.
        </p>


        <form id="forgot-password-form" novalidate>

            <label>
                Email

                <input
                    id="forgot-email"
                    type="email"
                    placeholder="Enter your email"
                >
            </label>


            <button
                class="primary-btn"
                type="submit"
            >
                Send OTP
            </button>


            <p
                id="forgot-message"
                class="form-message"
            ></p>

        </form>


        <p>
            Remember your password?
            <a href="/login">Back to Login</a>
        </p>

    </div>

</main>

{% endblock %}
